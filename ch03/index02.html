<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Business Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #eeeeee;
        }

        /* 카드 */
        .card {
            width: 400px;
            height: 240px;

            position: relative;
            overflow: hidden;

            border-radius: 20px;

            cursor: pointer;

            background: white;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }


        /* ======================
           처음 보이는 앞면
        ====================== */

        .front {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: opacity 0.7s ease;
        }

        .front h1 {
            margin: 0;

            font-size: 30px;
        }

        .front p {
            margin-top: 10px;

            font-size: 12px;
            color: #999;
        }


        /* ======================
           명함 내용
        ====================== */

        .info {
            position: absolute;

            inset: 0;

            padding: 35px;

            color: white;

            /* 처음에는 안 보임 */
            opacity: 0;

            transform: translateY(20px);

            /* 그라데이션 */
            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2,
                #f093fb
            );

            /* 그라데이션이 이동할 공간 */
            background-size: 200% 100%;

            /* 처음에는 오른쪽에 위치 */
            background-position: 100% 0;

            transition:
                opacity 0.8s ease 0.2s,
                transform 0.8s ease 0.2s,
                background-position 1.2s ease;
        }


        /* ======================
           클릭했을 때
        ====================== */

        .card.active .front {
            opacity: 0;
        }

        .card.active .info {
            opacity: 1;

            transform: translateY(0);

            /* 그라데이션이 왼쪽으로 스르륵 이동 */
            background-position: 0 0;
        }


        /* ======================
           명함 글씨
        ====================== */

        .info h1 {
            margin: 0 0 5px;

            font-size: 30px;

            opacity: 0;

            transform: translateY(15px);

            transition:
                opacity 0.6s ease 0.6s,
                transform 0.6s ease 0.6s;
        }

        .info > p {
            margin: 0;

            opacity: 0;

            transform: translateY(15px);

            transition:
                opacity 0.6s ease 0.8s,
                transform 0.6s ease 0.8s;
        }


        /* 연락처 */
        .contact {
            margin-top: 20px;
        }

        .contact p {
            margin: 5px 0;

            font-size: 14px;

            opacity: 0;

            transform: translateY(15px);

            transition:
                opacity 0.6s ease 1s,
                transform 0.6s ease 1s;
        }


        /* ======================
           클릭 후 글씨 나타남
        ====================== */

        .card.active .info h1,
        .card.active .info > p,
        .card.active .contact p {
            opacity: 1;

            transform: translateY(0);
        }

    </style>
</head>

<body>

    <div class="card" onclick="this.classList.toggle('active')">

        <!-- 앞면 -->
        <div class="front">
            <h1>MY CARD</h1>
            <p>CLICK ME</p>
        </div>


        <!-- 명함 내용 -->
        <div class="info">

            <h1>홍길동</h1>

            <p>IT Developer</p>

            <div class="contact">
                <p>📧 hong@example.com</p>
                <p>📱 010-1234-5678</p>
                <p>🌐 www.example.com</p>
            </div>

        </div>

    </div>

</body>
</html>
